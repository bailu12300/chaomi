plugins {
    id 'com.android.application'
}

// 采集密钥从 local.properties 读，**绝不写进源码**
// local.properties 已在 .gitignore 里，不会进仓库
def crawlerKey = ""
def lp = rootProject.file("local.properties")
if (lp.exists()) {
    def props = new Properties()
    lp.withInputStream { props.load(it) }
    crawlerKey = props.getProperty("CRAWLER_KEY", "")
}

android {
    namespace 'com.chaomi.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.chaomi.app'
        minSdk 21
        targetSdk 35
        versionCode 17
        versionName '3.0.0'
        vectorDrawables {
            useSupportLibrary true
        }
        buildConfigField "String", "CRAWLER_KEY", "\"${crawlerKey}\"" 
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig null
        }
        debug {
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.picasso:picasso:2.8'
    implementation 'org.java-websocket:Java-WebSocket:1.5.4'
}
