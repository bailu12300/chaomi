<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>去水印 · 超米</title>
<meta name="description" content="抖音 / 哔哩哔哩 / TikTok 短视频去水印，直接下载无水印视频，无需登录">
<meta name="theme-color" content="#0b0f1a">
<link rel="icon" href="/community/assets/icon.svg">
<style>
/* ===== 设计变量：跟随主题 ===== */
:root {
  --bg: #0b0f1a;
  --card: #131a28;
  --card-2: #1a2333;
  --line: rgba(255,255,255,.08);
  --line-strong: rgba(255,255,255,.16);
  --txt: #e6edf3;
  --txt-2: #8b949e;
  --txt-3: #6b7280;
  --acc: #58a6ff;
  --ok: #3fb950;
  --warn: #d29922;
  --bad: #f85149;
  --radius: 16px;
  --shadow: 0 8px 32px rgba(0,0,0,.4);
}
html[data-theme="light"] {
  --bg: #eef1f7;
  --card: #ffffff;
  --card-2: #f3f5f9;
  --line: rgba(0,0,0,.08);
  --line-strong: rgba(0,0,0,.16);
  --txt: #1a1f29;
  --txt-2: #5b6472;
  --txt-3: #8b949e;
  --acc: #0969da;
  --ok: #1a7f37;
  --warn: #9a6700;
  --bad: #cf222e;
  --shadow: 0 8px 32px rgba(31,45,80,.1);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; background: var(--bg); color: var(--txt);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  min-height: 100vh; min-height: 100dvh;
  padding: max(18px, env(safe-area-inset-top)) 16px
           max(28px, env(safe-area-inset-bottom));
  transition: background .25s, color .25s;
}
.wrap { max-width: 680px; margin: 0 auto; }

/* ===== 头部 ===== */
.head { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
.logo {
  width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
  background: linear-gradient(135deg, #58a6ff, #7c3aed);
  display: grid; place-items: center; font-size: 19px;
}
.head-txt { flex: 1; min-width: 0; }
.head h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.2px; }
.head p { margin: 2px 0 0; font-size: 12px; color: var(--txt-2); }
.icon-btn {
  width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
  background: var(--card); border: 1px solid var(--line); color: var(--txt-2);
  font-size: 16px; cursor: pointer; display: grid; place-items: center;
  transition: all .18s;
}
.icon-btn:active { transform: scale(.94); }

/* ===== 输入卡片 ===== */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.input-card { padding: 16px; }
textarea {
  width: 100%; box-sizing: border-box; resize: vertical;
  min-height: 92px; padding: 13px 14px;
  background: var(--card-2); border: 1px solid var(--line); border-radius: 12px;
  color: var(--txt); font: inherit; font-size: 14px; line-height: 1.6;
  outline: none; transition: border-color .18s;
}
textarea:focus { border-color: var(--acc); }
textarea::placeholder { color: var(--txt-3); }

.actions { display: flex; gap: 8px; margin-top: 11px; }
.btn {
  border: 1px solid var(--line); background: var(--card-2); color: var(--txt);
  border-radius: 11px; padding: 11px 18px; font-size: 14px; font-family: inherit;
  cursor: pointer; transition: all .18s; white-space: nowrap;
}
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary {
  background: var(--acc); border-color: var(--acc); color: #fff;
  font-weight: 600; flex: 1;
}
.btn.ghost { background: transparent; }
.btn.ghost:active:not(:disabled) { background: var(--card-2); }

/* ===== 平台支持条 ===== */
.plats {
  display: flex; gap: 6px; flex-wrap: wrap; margin-top: 13px;
  padding-top: 13px; border-top: 1px solid var(--line);
}
.plat {
  font-size: 11.5px; padding: 3px 10px; border-radius: 999px;
  background: var(--card-2); color: var(--txt-2); border: 1px solid var(--line);
}
.plat b { color: var(--ok); font-weight: 600; }

/* ===== 结果区 ===== */
#result { margin-top: 16px; }
.res {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  overflow: hidden; box-shadow: var(--shadow);
  animation: rise .28s cubic-bezier(.2,.8,.3,1);
}
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.res.ok { border-left: 3px solid var(--ok); }
.res.fail { border-left: 3px solid var(--warn); }

.res-head {
  display: flex; align-items: center; gap: 8px;
  padding: 13px 16px; border-bottom: 1px solid var(--line);
}
.tag {
  font-size: 11.5px; padding: 2px 10px; border-radius: 999px;
  background: var(--card-2); color: var(--txt-2); border: 1px solid var(--line);
}
.state { margin-left: auto; font-size: 12.5px; font-weight: 600; }
.state.ok { color: var(--ok); }
.state.warn { color: var(--warn); }
.state.bad { color: var(--bad); }

.res-body { padding: 16px; display: flex; gap: 14px; }
.cover {
  width: 132px; height: 82px; flex-shrink: 0; border-radius: 10px;
  object-fit: cover; background: var(--card-2); display: block;
}
.meta { flex: 1; min-width: 0; }
.title {
  font-size: 14.5px; font-weight: 600; line-height: 1.5; margin-bottom: 7px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden;
}
.sub { font-size: 12.5px; color: var(--txt-2); line-height: 1.9; word-break: break-all; }

.note {
  margin: 0 16px 14px; padding: 11px 13px; border-radius: 10px;
  background: var(--card-2); font-size: 12.5px; line-height: 1.8; color: var(--txt-2);
}
.res-foot { padding: 0 16px 16px; display: flex; gap: 9px; flex-wrap: wrap; }
.dl {
  flex: 1; min-width: 140px; text-align: center; text-decoration: none;
  background: var(--ok); color: #fff; padding: 13px; border-radius: 11px;
  font-size: 14.5px; font-weight: 600; transition: filter .18s;
}
.dl:active { filter: brightness(.92); }
.link {
  text-align: center; text-decoration: none; color: var(--acc);
  padding: 13px 18px; border-radius: 11px; border: 1px solid var(--line);
  font-size: 13.5px; background: var(--card-2);
}

/* 图集网格 */
.gallery {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px;
  padding: 0 16px 16px;
}
.gallery a { display: block; position: relative; aspect-ratio: 3/4; }
.gallery img {
  width: 100%; height: 100%; object-fit: cover; border-radius: 9px;
  background: var(--card-2); display: block;
}
.gallery a::after {
  content: "⬇"; position: absolute; right: 6px; bottom: 6px;
  width: 22px; height: 22px; border-radius: 50%;
  background: rgba(0,0,0,.62); color: #fff;
  display: grid; place-items: center; font-size: 11px;
}

/* ===== 历史 ===== */
.hist { margin-top: 22px; }
.hist-h {
  font-size: 12.5px; color: var(--txt-2); margin-bottom: 9px;
  display: flex; align-items: center;
}
.hist-h button {
  margin-left: auto; background: none; border: none; color: var(--txt-3);
  font-size: 12px; cursor: pointer; font-family: inherit; padding: 4px;
}
.hist-item {
  display: flex; align-items: center; gap: 10px; padding: 11px 14px;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  margin-bottom: 7px; cursor: pointer; transition: border-color .18s;
}
.hist-item:active { border-color: var(--line-strong); }
.hist-i { flex: 1; min-width: 0; }
.hist-t {
  font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hist-p { font-size: 11.5px; color: var(--txt-3); margin-top: 2px; }
.hist-go { color: var(--txt-3); font-size: 15px; flex-shrink: 0; }

/* ===== Toast ===== */
#toast {
  position: fixed; left: 50%; bottom: max(34px, env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(16px);
  background: rgba(28,34,48,.96); color: #fff; backdrop-filter: blur(12px);
  padding: 11px 20px; border-radius: 999px; font-size: 13.5px;
  opacity: 0; pointer-events: none; transition: all .26s cubic-bezier(.2,.8,.3,1);
  z-index: 99; max-width: 88vw; text-align: center;
  border: 1px solid rgba(255,255,255,.1);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===== 加载骨架 ===== */
.loading { padding: 26px 16px; text-align: center; color: var(--txt-2); font-size: 13.5px; }
.spin {
  width: 22px; height: 22px; margin: 0 auto 10px;
  border: 2.5px solid var(--line-strong); border-top-color: var(--acc);
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.foot {
  margin-top: 30px; text-align: center; font-size: 12px; color: var(--txt-3);
  line-height: 2;
}
.foot a { color: var(--txt-2); text-decoration: none; }
.foot a:active { color: var(--acc); }

/* 窄屏适配 */
@media (max-width: 400px) {
  .res-body { flex-direction: column; }
  .cover { width: 100%; height: 168px; }
  .gallery { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo">✂</div>
    <div class="head-txt">
      <h1>短视频去水印</h1>
      <p>粘链接就能下，无需登录</p>
    </div>
    <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">◐</button>
  </div>

  <div class="card input-card">
    <textarea id="input" placeholder="把分享内容整段粘进来：
【标题】https://b23.tv/xxxxx
7.94 复制打开抖音… https://v.douyin.com/xxxxx/"></textarea>
    <div class="actions">
      <button class="btn ghost" id="pasteBtn" type="button">粘贴</button>
      <button class="btn ghost" id="clearBtn" type="button">清空</button>
      <button class="btn primary" id="goBtn" type="button">开始解析</button>
    </div>
    <div class="plats">
      <span class="plat"><b>抖音</b> 视频 / 图集</span>
      <span class="plat"><b>哔哩哔哩</b> 视频</span>
      <span class="plat"><b>TikTok</b> 视频</span>
      <span class="plat">快手 / 小红书 展开链接</span>
    </div>
  </div>

  <div id="result"></div>

  <div class="hist" id="hist" style="display:none">
    <div class="hist-h">
      <span>最近解析</span>
      <button id="histClear" type="button">清空</button>
    </div>
    <div id="histList"></div>
  </div>

  <div class="foot">
    <a href="/community/">← 回超米社区</a> · <a href="/app">下载 App</a><br>
    所有解析在服务器完成，不经过第三方
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var HKEY = "chaomi_wm_hist_v1";
  var TKEY = "chaomi_theme";

  /* ---------- 主题 ---------- */
  function applyTheme(m) {
    document.documentElement.setAttribute("data-theme", m);
    $("#themeBtn").textContent = m === "light" ? "☀" : "◐";
    var mc = document.querySelector('meta[name=theme-color]');
    if (mc) mc.content = m === "light" ? "#eef1f7" : "#0b0f1a";
    try { localStorage.setItem(TKEY, m); } catch (e) {}
  }
  var saved = null;
  try { saved = localStorage.getItem(TKEY); } catch (e) {}
  if (!saved) {
    saved = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches)
      ? "light" : "dark";
  }
  applyTheme(saved);
  $("#themeBtn").onclick = function () {
    applyTheme(document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light");
  };

  /* ---------- 工具 ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  var tt;
  function toast(msg) {
    var t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(tt);
    tt = setTimeout(function () { t.classList.remove("show"); }, 2300);
  }

  /* ---------- 历史 ---------- */
  function getHist() {
    try { return JSON.parse(localStorage.getItem(HKEY) || "[]"); } catch (e) { return []; }
  }
  function pushHist(item) {
    var h = getHist().filter(function (x) { return x.url !== item.url; });
    h.unshift(item);
    h = h.slice(0, 6);
    try { localStorage.setItem(HKEY, JSON.stringify(h)); } catch (e) {}
    renderHist();
  }
  function renderHist() {
    var h = getHist();
    var box = $("#hist"), list = $("#histList");
    if (!h.length) { box.style.display = "none"; return; }
    box.style.display = "block";
    list.innerHTML = h.map(function (x, i) {
      return '<div class="hist-item" data-i="' + i + '">' +
        '<div class="hist-i"><div class="hist-t">' + esc(x.title || x.url) + '</div>' +
        '<div class="hist-p">' + esc(x.platform || "") + ' · ' + esc(x.time || "") + '</div></div>' +
        '<span class="hist-go">›</span></div>';
    }).join("");
    Array.prototype.forEach.call(list.querySelectorAll(".hist-item"), function (el) {
      el.onclick = function () {
        var it = getHist()[+el.dataset.i];
        if (it) { $("#input").value = it.url; doParse(); }
      };
    });
  }
  $("#histClear").onclick = function () {
    try { localStorage.removeItem(HKEY); } catch (e) {}
    renderHist();
    toast("已清空");
  };
  renderHist();

  /* ---------- 解析 ---------- */
  var busy = false;

  function setResult(html) { $("#result").innerHTML = html; }

  function renderData(d) {
    var ok = !!d.ok;
    var cls = ok ? "ok" : "fail";
    var stateTxt = ok ? "解析成功" : (d.originalUrl ? "仅展开链接" : "未解析");

    var html = '<div class="res ' + cls + '">' +
      '<div class="res-head">' +
        '<span class="tag">' + esc(d.platformName || "未知平台") + '</span>' +
        '<span class="state ' + (ok ? "ok" : "warn") + '">' + stateTxt + '</span>' +
      '</div>';

    if (d.title || d.cover) {
      html += '<div class="res-body">';
      if (d.cover) {
        html += '<img class="cover" src="' + esc(d.cover) + '" referrerpolicy="no-referrer" ' +
          'onerror="this.style.display=\'none\'" alt="">';
      }
      html += '<div class="meta">';
      if (d.title) html += '<div class="title">' + esc(d.title) + '</div>';
      var sub = [];
      if (d.author) sub.push("作者：" + d.author);
      if (d.duration > 0) {
        var m = Math.floor(d.duration / 60), sec = d.duration % 60;
        sub.push("时长：" + m + ":" + (sec < 10 ? "0" : "") + sec);
      }
      if (sub.length) html += '<div class="sub">' + esc(sub.join(" · ")) + '</div>';
      html += '</div></div>';
    }

    if (d.note) html += '<div class="note">' + esc(d.note) + '</div>';

    // 图集
    if (d.images && d.images.length) {
      html += '<div class="gallery">';
      d.images.forEach(function (u, i) {
        html += '<a href="' + esc(u) + '" download="img_' + (i + 1) + '.jpg" target="_blank" rel="noopener">' +
          '<img src="' + esc(u) + '" referrerpolicy="no-referrer" loading="lazy" alt=""></a>';
      });
      html += '</div>';
    }

    html += '<div class="res-foot">';
    if (d.videoUrl) {
      var nm = (d.title || "video").replace(/[\\/:*?"<>|]/g, "_").slice(0, 40) + ".mp4";
      var dl = "/api/watermark/dl?u=" + encodeURIComponent(d.videoUrl) +
               "&r=" + encodeURIComponent(d.originalUrl || "") +
               "&name=" + encodeURIComponent(nm);
      html += '<a class="dl" href="' + dl + '">⬇ 下载无水印视频</a>';
    }
    if (d.originalUrl) {
      html += '<a class="link" href="' + esc(d.originalUrl) + '" target="_blank" rel="noopener">打开原链接 ↗</a>';
    }
    html += '</div></div>';

    setResult(html);
  }

  function doParse() {
    if (busy) return;
    var raw = $("#input").value.trim();
    if (!raw) { toast("请先粘贴分享内容"); $("#input").focus(); return; }

    busy = true;
    var btn = $("#goBtn");
    btn.disabled = true;
    btn.textContent = "解析中…";
    setResult('<div class="card loading"><div class="spin"></div>正在解析，抖音首次可能需要十几秒…</div>');

    fetch("/api/watermark", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: raw })
    }).then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, j: j }; });
    }).then(function (res) {
      if (!res.ok || !res.j || res.j.code !== 0) {
        throw new Error((res.j && res.j.error) || "解析失败");
      }
      var d = res.j.data || {};
      renderData(d);
      if (d.ok) {
        pushHist({
          url: raw,
          title: d.title || raw.slice(0, 40),
          platform: d.platformName || "",
          time: new Date().toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" })
        });
      }
    }).catch(function (e) {
      setResult('<div class="res fail"><div class="res-head">' +
        '<span class="tag">解析失败</span>' +
        '<span class="state bad">出错</span></div>' +
        '<div class="note">' + esc(e.message || "网络异常，请重试") + '</div></div>');
    }).then(function () {
      busy = false;
      btn.disabled = false;
      btn.textContent = "开始解析";
    });
  }

  /* ---------- 交互 ---------- */
  $("#goBtn").onclick = doParse;

  $("#pasteBtn").onclick = function () {
    if (!navigator.clipboard || !navigator.clipboard.readText) {
      $("#input").focus();
      toast("请长按输入框粘贴");
      return;
    }
    navigator.clipboard.readText().then(function (t) {
      if (t) { $("#input").value = t; toast("已粘贴"); }
      else { toast("剪贴板是空的"); }
    }).catch(function () {
      $("#input").focus();
      toast("请长按输入框粘贴");
    });
  };

  $("#clearBtn").onclick = function () {
    $("#input").value = "";
    setResult("");
    $("#input").focus();
  };

  // Ctrl / Cmd + Enter 快速解析
  $("#input").addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") doParse();
  });

  // 进页面自动读剪贴板（有内容且像链接才填）
  (function autoFill() {
    if (!navigator.clipboard || !navigator.clipboard.readText) return;
    navigator.clipboard.readText().then(function (t) {
      if (t && /https?:\/\//.test(t) && !$("#input").value.trim()) {
        $("#input").value = t;
      }
    }).catch(function () {});
  })();
})();
</script>
</body>
</html>
